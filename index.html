<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Électromécanique — Exercices interactifs</title>
<style>
:root{
  --bg:#0f1117;--bg3:#242840;--card:#1e2235;
  --border:#2d3252;--accent:#4f8ef7;--accent2:#f7a24f;
  --success:#4fcf8a;--danger:#f74f6a;
  --text:#e8eaf6;--text2:#9ba3c8;--text3:#6b74a0;
  --font:'Segoe UI',system-ui,sans-serif;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
header{background:linear-gradient(135deg,#1a1d2e,#242840);border-bottom:1px solid var(--border);padding:1.2rem 1.5rem;display:flex;align-items:center;gap:1rem;}
.logo{font-size:1.8rem;}
.htxt h1{font-size:1.3rem;font-weight:700;color:var(--accent);}
.htxt p{font-size:.78rem;color:var(--text2);}
.badge{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.72rem;color:var(--accent2);margin-left:auto;}
nav{display:flex;gap:8px;padding:1rem 1.5rem;flex-wrap:wrap;}
.nbtn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.85rem;font-family:var(--font);transition:all .2s;}
.nbtn:hover{border-color:var(--accent);color:var(--accent);}
.nbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
main{max-width:900px;margin:0 auto;padding:0 1.2rem 3rem;}

/* Score bar */
.sbar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1.2rem;margin:1rem 0;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;}
.si{text-align:center;}
.sn{font-size:1.5rem;font-weight:700;}
.sl{font-size:.72rem;color:var(--text2);}
.si.ok .sn{color:var(--success);}
.si.ko .sn{color:var(--danger);}
.si.left .sn{color:var(--accent);}
.pw{flex:1;min-width:120px;}
.pb{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.pf{height:100%;background:var(--accent);border-radius:4px;transition:width .4s;}

/* Exercice */
.excard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1rem;}
.exnum{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem;}
.exq{font-size:1rem;line-height:1.7;margin-bottom:1.2rem;}
.exq strong{color:var(--accent2);}
.svgw{margin:.8rem 0;background:#111827;border-radius:8px;padding:.5rem;text-align:center;}
.arow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.ainp{flex:1;min-width:140px;padding:10px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;font-family:var(--font);outline:none;transition:border-color .2s;}
.ainp:focus{border-color:var(--accent);}
.ainp.ok{border-color:var(--success);}
.ainp.ko{border-color:var(--danger);}
.ulab{color:var(--text2);font-size:.9rem;min-width:40px;}
.vbtn{padding:10px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;font-family:var(--font);}
.vbtn:disabled{opacity:.4;cursor:not-allowed;}

/* Feedback */
.fb{margin-top:1rem;padding:1rem 1.2rem;border-radius:8px;display:none;font-size:.9rem;line-height:1.6;}
.fb.show{display:block;}
.fb.ok{background:rgba(79,207,138,.08);border:1px solid rgba(79,207,138,.3);}
.fb.ko{background:rgba(247,79,106,.08);border:1px solid rgba(247,79,106,.3);}
.fbt{font-weight:700;margin-bottom:.5rem;font-size:1rem;}
.fb.ok .fbt{color:var(--success);}
.fb.ko .fbt{color:var(--danger);}
.step{margin:.4rem 0;padding:.5rem .8rem;background:var(--bg3);border-radius:6px;border-left:3px solid var(--accent);font-size:.88rem;font-family:'Courier New',monospace;color:var(--accent2);}

/* Next btn */
.nxtbtn{padding:10px 22px;background:var(--success);color:#111;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:700;font-family:var(--font);margin-top:.8rem;display:none;}
.nxtbtn.show{display:inline-block;}

/* Résultats */
.rescrd{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:2rem;text-align:center;margin-top:1rem;display:none;}
.rescrd.show{display:block;}
.resbig{font-size:3rem;font-weight:800;color:var(--accent);}
.ressub{color:var(--text2);margin:.5rem 0 1.5rem;}
.rbtn{padding:12px 28px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:700;font-family:var(--font);}

/* Théorie */
.theory{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem;margin-bottom:1rem;display:none;}
.theory.show{display:block;}
.theory h2{color:var(--accent);margin-bottom:.8rem;font-size:1rem;}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;}
.fbox{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.8rem 1rem;text-align:center;}
.fdesc{font-size:.78rem;color:var(--text2);margin-bottom:.4rem;}
.fdesc2{font-size:.78rem;color:var(--text2);margin-top:.4rem;}
.feq{font-size:1.1rem;font-weight:700;color:var(--accent2);vertical-align:middle;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;}
.frac .num{font-size:1rem;font-weight:700;color:var(--accent2);line-height:1.1;}
.frac .bar{width:100%;height:2px;background:var(--accent2);margin:2px 0;}
.frac .den{font-size:1rem;font-weight:700;color:var(--accent2);line-height:1.1;}
.fracs{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;}
.fracs .num{font-size:.88rem;font-weight:700;color:var(--accent2);line-height:1.1;}
.fracs .bar{width:100%;height:1.5px;background:var(--accent2);margin:2px 0;}
.fracs .den{font-size:.88rem;font-weight:700;color:var(--accent2);line-height:1.1;}
.feqs{font-size:.92rem;font-weight:700;color:var(--accent2);vertical-align:middle;}
.mattbl{width:100%;border-collapse:collapse;margin-top:.6rem;font-size:.82rem;}
.mattbl th{background:var(--card);color:var(--text2);padding:5px 8px;border:1px solid var(--border);text-align:left;}
.mattbl td{padding:5px 8px;border:1px solid var(--border);}
.mattbl tr:nth-child(even) td{background:rgba(255,255,255,.03);}

/* Module classe */
.ccrd{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1rem;}
.cenonce{font-size:1rem;line-height:1.7;margin-bottom:1.2rem;border-left:3px solid var(--accent2);padding-left:.8rem;}
.cenonce strong{color:var(--accent2);}
.sq{background:var(--bg3);border-radius:8px;padding:1rem;margin-bottom:.8rem;}
.sqlbl{font-size:.78rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:.4rem;}
.sqq{font-size:.95rem;margin-bottom:.7rem;line-height:1.6;}
.sqrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sqinp{flex:1;min-width:120px;padding:8px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;color:var(--text);font-size:1rem;font-family:var(--font);outline:none;}
.sqinp:focus{border-color:var(--accent);}
.sqinp.ok{border-color:var(--success);}
.sqinp.ko{border-color:var(--danger);}
.sqinp:disabled{opacity:.7;}
.squnit{color:var(--text2);font-size:.9rem;}
.sqbtn{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:600;font-family:var(--font);}
.sqbtn:disabled{opacity:.4;cursor:not-allowed;}
.sqfb{margin-top:.5rem;padding:.5rem .7rem;border-radius:6px;display:none;font-size:.87rem;line-height:1.5;}
.sqfb.show{display:block;}
.sqfb.ok{background:rgba(79,207,138,.08);border:1px solid rgba(79,207,138,.25);color:var(--success);}
.sqfb.ko{background:rgba(247,79,106,.08);border:1px solid rgba(247,79,106,.25);}
.sqfb.ko .sqfbt{color:var(--danger);font-weight:700;}
.cnav{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap;}
.cprev,.cnext{padding:9px 18px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);border-radius:8px;cursor:pointer;font-size:.88rem;font-family:var(--font);}
.cnext{background:var(--success);color:#111;border-color:var(--success);font-weight:700;}
.cctr{font-size:.82rem;color:var(--text3);margin-bottom:.5rem;}

/* SVG */
.wire{stroke:#6b9fff;stroke-width:2.5;fill:none;}
.vlbl{fill:#f7a24f;font-family:'Segoe UI',sans-serif;}
.ulbl{fill:#f74f6a;font-family:'Segoe UI',sans-serif;font-weight:bold;}
.lbl{fill:#e8eaf6;font-family:'Segoe UI',sans-serif;}
.arr{fill:#f7a24f;}

@media(max-width:600px){
  header{padding:.9rem 1rem;}
  .htxt h1{font-size:1.1rem;}
  nav{padding:.8rem 1rem;}
  main{padding:0 .8rem 2rem;}
  .arow,.sqrow{flex-direction:column;align-items:stretch;}
}
</style>
</head>
<body>

<header>
  <div class="logo">⚡</div>
  <div class="htxt">
    <h1>Électromécanique — Exercices interactifs</h1>
    <p>3e–4e année · Enseignement technique de qualification</p>
  </div>
  <span class="badge">Créé par : C. Lucy</span>
</header>

<nav>
  <button class="nbtn active" onclick="chargerModule('ohm',this)">⚡ Loi d'Ohm</button>
  <button class="nbtn" onclick="chargerModule('pouillet',this)">🔩 Loi de Pouillet</button>
  <button class="nbtn" onclick="chargerModule('classe',this)">📋 Exercices de classe</button>
  <button class="nbtn" onclick="basculerTheorie()">📖 Rappels de cours</button>
</nav>

<main>
  <div id="theorie" class="theory"></div>

  <div id="sbar" class="sbar">
    <div class="si ok"><div class="sn" id="sok">0</div><div class="sl">Correct</div></div>
    <div class="si ko"><div class="sn" id="sko">0</div><div class="sl">Erreurs</div></div>
    <div class="si left"><div class="sn" id="sleft">10</div><div class="sl">Restants</div></div>
    <div class="pw"><div class="pb"><div class="pf" id="prog" style="width:0%"></div></div></div>
  </div>

  <div id="exzone"></div>

  <div id="rescrd" class="rescrd">
    <div class="resbig" id="resscore"></div>
    <div class="ressub" id="resmsg"></div>
    <button class="rbtn" onclick="relancer()">🔄 Recommencer</button>
  </div>
</main>

<script>
// ── Utilitaires ──────────────────────────────────────────
function r2(n){return Math.round(n*100)/100;}
function fmt(n){
  let v=r2(n);
  return Number.isInteger(v)?String(v):v.toFixed(2).replace('.',',');
}
function fq(n){return String(n).replace('.',',');}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function verifRep(s,correct){
  let v=parseFloat(s.replace(',','.'));
  if(isNaN(v))return false;
  let c=r2(correct);
  return Math.abs(v-c)<=Math.max(0.02,Math.abs(c)*0.02);
}
function frac(n,d){return `<span class="frac"><span class="num">${n}</span><span class="bar"></span><span class="den">${d}</span></span>`;}
function fracs(n,d){return `<span class="fracs"><span class="num">${n}</span><span class="bar"></span><span class="den">${d}</span></span>`;}
function stepH(s){return `<div class="step">${s}</div>`;}

// ── Batterie SVG IEC ────────────────────────────────────
function batSVG(cx,y1,y2,lab){
  let my=(y1+y2)/2;
  let ls=[{w:22,y:my-9,sw:2.5},{w:14,y:my-3,sw:1.5},{w:22,y:my+3,sw:2.5},{w:14,y:my+9,sw:1.5}];
  let ll=ls.map(l=>`<line x1="${cx-l.w/2}" y1="${l.y}" x2="${cx+l.w/2}" y2="${l.y}" stroke="#6b9fff" stroke-width="${l.sw}" stroke-linecap="round"/>`).join('');
  return `<line x1="${cx}" y1="${y1}" x2="${cx}" y2="${my-9}" class="wire"/>
<line x1="${cx}" y1="${my+9}" x2="${cx}" y2="${y2}" class="wire"/>
${ll}
<text x="${cx+14}" y="${my-9}" class="lbl" font-size="12" dominant-baseline="middle">+</text>
<text x="${cx+14}" y="${my+9}" class="lbl" font-size="12" dominant-baseline="middle">−</text>
${lab?`<text x="${cx}" y="${y2+16}" text-anchor="middle" class="vlbl" font-size="13">${lab}</text>`:''}`;
}

// ── SVG Ohm ─────────────────────────────────────────────
function svgOhm(d,find,show){
  let dU=(!show&&find==='U')?'?':fmt(d.U)+' V';
  let dR=(!show&&find==='R')?'?':fmt(d.R)+' Ω';
  let dI=(!show&&find==='I')?'?':fmt(d.I)+' A';
  let cU=(!show&&find==='U')?'ulbl':'vlbl';
  let cR=(!show&&find==='R')?'ulbl':'vlbl';
  let cI=(!show&&find==='I')?'ulbl':'vlbl';
  return `<svg viewBox="0 0 400 178" width="100%" style="max-width:420px">
<line x1="55" y1="35" x2="360" y2="35" class="wire"/>
<line x1="360" y1="35" x2="360" y2="140" class="wire"/>
<line x1="360" y1="140" x2="55" y2="140" class="wire"/>
${batSVG(55,35,140,dU)}
<text x="55" y="22" text-anchor="middle" class="lbl" font-size="11">E</text>
<rect x="195" y="24" width="90" height="22" rx="3" fill="#1e2235" stroke="#6b9fff" stroke-width="1.8"/>
<text x="240" y="36" text-anchor="middle" class="lbl" font-size="11" dominant-baseline="middle">R</text>
<text x="240" y="16" text-anchor="middle" class="${cR}" font-size="13">${dR}</text>
<polygon points="110,31 128,35 110,39" class="arr"/>
<text x="119" y="58" text-anchor="middle" class="${cI}" font-size="13">${dI}</text>
</svg>`;
}

// ── SVG Pouillet ────────────────────────────────────────
function svgPouillet(d,find,show){
  let dR=(!show&&find==='R')?'?':fmt(d.R)+' Ω';
  let dL=(!show&&find==='L')?'?':fq(d.L)+' m';
  let dS=(!show&&find==='S')?'?':d.Sstr+' m²';
  let cR=(!show&&find==='R')?'ulbl':'vlbl';
  let cL=(!show&&find==='L')?'ulbl':'vlbl';
  let cS=(!show&&find==='S')?'ulbl':'vlbl';
  return `<svg viewBox="0 0 460 160" width="100%" style="max-width:480px">
<rect x="80" y="58" width="290" height="44" rx="4" fill="#1a2a3a" stroke="#4f8ef7" stroke-width="1.8"/>
<ellipse cx="80" cy="80" rx="12" ry="22" fill="#1e3a5a" stroke="#4f8ef7" stroke-width="1.8"/>
<ellipse cx="370" cy="80" rx="12" ry="22" fill="#1e3a5a" stroke="#4f8ef7" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="80" y1="118" x2="370" y2="118" stroke="#6b9fff" stroke-width="1.2" stroke-dasharray="4,3"/>
<polygon points="80,115 92,118 80,121" fill="#6b9fff"/>
<polygon points="370,115 358,118 370,121" fill="#6b9fff"/>
<text x="225" y="135" text-anchor="middle" class="${cL}" font-size="12">L = ${dL}</text>
<text x="225" y="76" text-anchor="middle" class="lbl" font-size="11">${d.mat}</text>
<text x="225" y="91" text-anchor="middle" class="lbl" font-size="10">ρ = ${d.rhoStr} Ω·m</text>
<text x="30" y="78" text-anchor="middle" class="${cS}" font-size="11">S=${dS}</text>
<text x="420" y="78" text-anchor="middle" class="${cR}" font-size="13" font-weight="bold">${dR}</text>
<text x="420" y="93" text-anchor="middle" class="lbl" font-size="10">R</text>
</svg>`;
}

// ── Matériaux ────────────────────────────────────────────
const MATS=[
  {name:'Cuivre',    rho:1.6e-8, rhoStr:'1,6 × 10⁻⁸'},
  {name:'Aluminium', rho:2.7e-8, rhoStr:'2,7 × 10⁻⁸'},
  {name:'Fer',       rho:1.0e-7, rhoStr:'1,0 × 10⁻⁷'},
  {name:'Acier',     rho:1.3e-7, rhoStr:'1,3 × 10⁻⁷'},
  {name:'Zinc',      rho:5.9e-8, rhoStr:'5,9 × 10⁻⁸'},
  {name:'Nickel',    rho:7.0e-8, rhoStr:'7,0 × 10⁻⁸'},
  {name:'Tungstène', rho:5.5e-8, rhoStr:'5,5 × 10⁻⁸'},
  {name:'Plomb',     rho:2.1e-7, rhoStr:'2,1 × 10⁻⁷'},
];
const SECS=[
  {m2:0.5e-6, str:'0,5 × 10⁻⁶'},
  {m2:1.0e-6, str:'1,0 × 10⁻⁶'},
  {m2:1.5e-6, str:'1,5 × 10⁻⁶'},
  {m2:2.5e-6, str:'2,5 × 10⁻⁶'},
  {m2:4.0e-6, str:'4,0 × 10⁻⁶'},
  {m2:6.0e-6, str:'6,0 × 10⁻⁶'},
  {m2:10.0e-6,str:'10,0 × 10⁻⁶'},
];
const LONGS=[10,15,20,25,30,40,50,60,75,100,120,150,200];

// ── Types exercices Ohm ──────────────────────────────────
const typesOhm=[
  {find:'R',unit:'Ω',gen(){
    let I=pick([0.5,1,1.5,2,2.5,3,4,5]);
    let R=pick([2,4,5,6,8,10,12,15,20,25,30,47,50]);
    let U=r2(R*I);
    return {U,I,R,q:`Une résistance branchée sur <strong>${fq(U)} V</strong> est traversée par <strong>${fq(I)} A</strong>. Calculez sa valeur.`};
  },steps(d){return[`Formule : R = ${fracs('U','I')}`,`R = ${fracs(fq(d.U),fq(d.I))}`,`R = <strong>${fmt(d.R)} Ω</strong>`];}},
  {find:'U',unit:'V',gen(){
    let I=pick([0.1,0.2,0.25,0.5,1,1.5,2,2.5,3,4,5]);
    let R=pick([2,4,5,6,8,10,12,15,20,47,100,220,330]);
    let U=r2(R*I);
    return {U,I,R,q:`Une résistance de <strong>${fq(R)} Ω</strong> est traversée par <strong>${fq(I)} A</strong>. Quelle tension est appliquée ?`};
  },steps(d){return[`Formule : U = R × I`,`U = ${fq(d.R)} × ${fq(d.I)}`,`U = <strong>${fmt(d.U)} V</strong>`];}},
  {find:'I',unit:'A',gen(){
    let I=pick([0.1,0.2,0.25,0.5,1,1.5,2,2.5,3,4,5]);
    let R=pick([2,4,5,6,8,10,12,15,20,24,47,100,220]);
    let U=r2(R*I);
    return {U,I,R,q:`Une résistance de <strong>${fq(R)} Ω</strong> alimentée sous <strong>${fq(U)} V</strong>. Quel courant la traverse ?`};
  },steps(d){return[`Formule : I = ${fracs('U','R')}`,`I = ${fracs(fq(d.U),fq(d.R))}`,`I = <strong>${fmt(d.I)} A</strong>`];}},
  {find:'R',unit:'Ω',gen(){
    let U=pick([12,24,48,110,230]);
    let R=pick([4,5,6,8,10,12,15,20]);
    let I=r2(U/R);
    let app=pick(['moteur','pompe','résistance de chauffage','bobine']);
    return {U,I,R,q:`Un ${app} alimenté sous <strong>${fq(U)} V</strong> absorbe <strong>${fq(I)} A</strong>. Calculez sa résistance.`};
  },steps(d){return[`Formule : R = ${fracs('U','I')}`,`R = ${fracs(fq(d.U),fq(d.I))}`,`R = <strong>${fmt(d.R)} Ω</strong>`];}},
  {find:'I',unit:'A',gen(){
    let U=pick([12,24,48,110,230]);
    let R=pick([4,5,6,8,10,12,15,20,46]);
    let I=r2(U/R);
    let app=pick(['moteur électrique','compresseur','ventilateur','pompe']);
    return {U,I,R,q:`Un ${app} de résistance <strong>${fq(R)} Ω</strong> alimenté sous <strong>${fq(U)} V</strong>. Calculez l'intensité.`};
  },steps(d){return[`Formule : I = ${fracs('U','R')}`,`I = ${fracs(fq(d.U),fq(d.R))}`,`I = <strong>${fmt(d.I)} A</strong>`];}},
  {find:'U',unit:'V',gen(){
    let R=pick([0.1,0.15,0.2,0.25,0.35,0.5]);
    let I=pick([5,8,10,12,16,20,25,32]);
    let U=r2(R*I);
    return {U,I,R,q:`Un câble de résistance <strong>${fq(R)} Ω</strong> traversé par <strong>${fq(I)} A</strong>. Calculez la chute de tension.`};
  },steps(d){return[`Formule : U = R × I`,`U = ${fq(d.R)} × ${fq(d.I)}`,`ΔU = <strong>${fmt(d.U)} V</strong>`];}},
  {find:'R',unit:'Ω',gen(){
    let I=pick([0.05,0.08,0.1,0.15,0.2,0.25,0.5]);
    let U=pick([3,4.5,6,9,12,15,24]);
    let R=r2(U/I);

function rn(n,d){return Math.round(n*Math.pow(10,d))/Math.pow(10,d);}
function sci(n){
  if(n===0)return'0';
  let e=Math.floor(Math.log10(Math.abs(n)));
  let m=Math.round(n/Math.pow(10,e)*1000)/1000;
  let sup={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  let es=String(e).split('').map(c=>sup[c]||c).join('');
  return String(m).replace('.',',')+' × 10'+es;
}

function shuffle(a){
  let b=[...a];
  for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}

function getAns(ex){
  if(ex.find==='R')return r2(ex.d.R);
  if(ex.find==='L')return r2(ex.d.L);
  if(ex.find==='S')return ex.d.S;
  return r2(ex.d.R);
}

function checkEx(val,ex){
  if(ex.find==='S'){
    let v=parseFloat(val.replace(',','.'));
    return !isNaN(v)&&Math.abs(v-ex.d.S)/ex.d.S<=0.03;
  }
  return verifRep(val,getAns(ex));
}

// ── Charger module ───────────────────────────────────────
function chargerModule(nom,btn){
  MODULE=nom;
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  theVisible=false;
  document.getElementById('theorie').classList.remove('show');
  if(nom==='classe'){
    document.getElementById('sbar').style.display='none';
    document.getElementById('rescrd').classList.remove('show');
    clIdx=0;
    clRep={};
    EXS.forEach((_,i)=>{clRep[i]={};EXS[i].sqs.forEach((_,j)=>{clRep[i][j]=null;});});
    rendrClasse();
  }else{
    document.getElementById('sbar').style.display='flex';
    relancer();
  }
}

function relancer(){
  exos=genExos();
  idx=0;ok=0;ko=0;repondus=0;
  document.getElementById('rescrd').classList.remove('show');
  document.getElementById('theorie').innerHTML=getTheorie();
  majScore();
  rendrEx();
}

function basculerTheorie(){
  theVisible=!theVisible;
  let p=document.getElementById('theorie');
  if(MODULE!=='classe') p.innerHTML=getTheorie();
  p.classList.toggle('show',theVisible);
}

function majScore(){
  let total=exos.length;
  document.getElementById('sok').textContent=ok;
  document.getElementById('sko').textContent=ko;
  document.getElementById('sleft').textContent=total-repondus;
  document.getElementById('prog').style.width=(repondus/total*100)+'%';
}

// ── Rendu exercice aléatoire ─────────────────────────────
function rendrEx(){
  if(idx>=exos.length){afficherResultats();return;}
  let ex=exos[idx];
  let ph=ex.find==='S'?'Ex : 1.5e-6':'Ex : 4  ou  4,5';
  document.getElementById('exzone').innerHTML=`
<div class="excard">
  <div class="exnum">${MODULE==='ohm'?"Loi d'Ohm":"Loi de Pouillet"} · Exercice ${idx+1} / ${exos.length}</div>
  <div class="exq">${ex.q}</div>
  <div class="svgw">${getSVG(ex,false)}</div>
  <div class="arow">
    <input class="ainp" id="ainp" type="text" placeholder="${ph}" onkeydown="if(event.key==='Enter')verifier()">
    <span class="ulab">${ex.unit}</span>
    <button class="vbtn" id="vbtn" onclick="verifier()">Vérifier ✓</button>
  </div>
  <div class="fb" id="fb"></div>
  <button class="nxtbtn" id="nxtbtn" onclick="suivant()">${idx+1<exos.length?'Exercice suivant →':'Voir mes résultats →'}</button>
</div>`;
  document.getElementById('ainp').focus();
}

function verifier(){
  let ex=exos[idx];
  let ans=getAns(ex);
  let inp=document.getElementById('ainp');
  let fb=document.getElementById('fb');
  let vbtn=document.getElementById('vbtn');
  let nxt=document.getElementById('nxtbtn');
  let val=inp.value.trim();
  if(!val){inp.focus();return;}
  vbtn.disabled=true;inp.disabled=true;repondus++;
  let show=getSVG(ex,true);
  let ansDisp=ex.find==='S'?ex.d.Sstr+' m²':fmt(ans)+' '+ex.unit;
  let bon=checkEx(val,ex);
  if(bon){
    ok++;inp.classList.add('ok');
    fb.className='fb show ok';
    fb.innerHTML=`<div class="fbt">✅ Bonne réponse !</div><div>${ansDisp}</div>
    <div style="margin-top:.5rem">${ex.steps().map(stepH).join('')}</div>
    <div class="svgw">${show}</div>`;
  }else{
    ko++;inp.classList.add('ko');
    fb.className='fb show ko';
    fb.innerHTML=`<div class="fbt">❌ Réponse incorrecte</div>
    <div>Ta réponse : <strong>${val}</strong> · Bonne réponse : <strong>${ansDisp}</strong></div>
    <div style="margin-top:.5rem;color:var(--text2);font-size:.85rem">📐 Résolution :</div>
    ${ex.steps().map(stepH).join('')}
    <div class="svgw">${show}</div>`;
  }
  majScore();
  nxt.classList.add('show');
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function suivant(){idx++;rendrEx();}

function afficherResultats(){
  document.getElementById('exzone').innerHTML='';
  let total=exos.length,pct=Math.round(ok/total*100);
  let msg=pct>=80?'🎉 Excellent ! Maîtrise acquise.':pct>=60?'👍 Bon résultat. Revois les exercices manqués.':pct>=40?'📚 Des lacunes. Consulte le rappel de cours.':'🔄 Beaucoup à retravailler.';
  document.getElementById('resscore').textContent=ok+' / '+total;
  document.getElementById('resmsg').textContent=msg+` (${pct}%)`;
  document.getElementById('rescrd').classList.add('show');
}

// ── Module classe ────────────────────────────────────────
function rendrClasse(){
  let ex=EXS[clIdx];
  let sqsH=ex.sqs.map((sq,si)=>{
    let st=clRep[clIdx][si];
    let cls=st===true?'sqinp ok':st===false?'sqinp ko':'sqinp';
    let ansDisp=sq.disp||(fmt(sq.ans)+' '+sq.unit);
    let fbH='';
    if(st===true){
      fbH=`<div class="sqfb show ok">✅ Bonne réponse — ${ansDisp}
        <div style="margin-top:.4rem">${sq.steps.map(stepH).join('')}</div></div>`;
    }else if(st===false){
      fbH=`<div class="sqfb show ko"><div class="sqfbt">❌ Réponse incorrecte</div>
        <div style="color:var(--text2);margin:.3rem 0">Bonne réponse : <strong>${ansDisp}</strong></div>
        ${sq.steps.map(stepH).join('')}</div>`;
    }
    return `<div class="sq">
      ${sq.lbl?`<div class="sqlbl">${sq.lbl}</div>`:''}
      <div class="sqq">${sq.q}</div>
      <div class="sqrow">
        <input type="text" class="${cls}" id="sqinp${si}" placeholder="Votre réponse"
          ${st!==null?'disabled':''} onkeydown="if(event.key==='Enter')verifSQ(${si})">
        <span class="squnit">${sq.unit}</span>
        <button class="sqbtn" onclick="verifSQ(${si})" ${st!==null?'disabled':''}>Vérifier ✓</button>
      </div>${fbH}</div>`;
  }).join('');

  document.getElementById('exzone').innerHTML=`
<div class="ccrd">
  <div class="cctr">Exercice ${clIdx+1} / ${EXS.length}</div>
  <div class="exnum">📋 Exercice ${ex.num} — ${ex.titre}</div>
  <div class="cenonce">${ex.enonce}</div>
  ${sqsH}
  <div class="cnav">
    ${clIdx>0?`<button class="cprev" onclick="navCl(-1)">← Précédent</button>`:''}
    ${clIdx<EXS.length-1?`<button class="cnext" onclick="navCl(1)">Suivant →</button>`:''}
  </div>
</div>`;
}

function verifSQ(si){
  let sq=EXS[clIdx].sqs[si];
  let val=document.getElementById('sqinp'+si).value.trim();
  if(!val)return;
  let bon;
  if(sq.tol){
    let v=parseFloat(val.replace(',','.'));
    bon=!isNaN(v)&&Math.abs(v-sq.ans)/Math.abs(sq.ans)<=sq.tol;
  }else{
    bon=verifRep(val,sq.ans);
  }
  clRep[clIdx][si]=bon;
  rendrClasse();
}

function navCl(d){
  clIdx=Math.max(0,Math.min(EXS.length-1,clIdx+d));
  rendrClasse();
}

// ── Démarrage ────────────────────────────────────────────
chargerModule('ohm', document.querySelector('.nbtn.active'));
</script>
</body>
</html>
